# =============================================================================
#  Promtail — coletor de logs (1 por nó, modo global)
# =============================================================================
#  Descobre os containers via socket do Docker e envia os logs ao Loki, já
#  enriquecidos com labels úteis (serviço do Swarm, stack, container, stream).
#  Esses labels permitem filtrar no Grafana, por ex.:
#     {stack="scsi_v1", service="scsi_v1_app"}
# =============================================================================
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Nome do container (remove a barra inicial).
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      # stdout/stderr.
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'logstream'
      # Nome do serviço no Swarm (ex.: scsi_v1_app, monitoring_grafana).
      - source_labels: ['__meta_docker_container_label_com_docker_swarm_service_name']
        target_label: 'service'
      # Nome da stack (ex.: scsi_v1, monitoring).
      - source_labels: ['__meta_docker_container_label_com_docker_stack_namespace']
        target_label: 'stack'
