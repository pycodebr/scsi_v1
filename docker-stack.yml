version: "3.9"

services:
  traefik:
    image: traefik:v3.6
    command:
      # API / Dashboard
      - "--api.dashboard=true"
      - "--api.insecure=false"

      # Docker Swarm provider
      - "--providers.swarm=true"
      - "--providers.swarm.endpoint=unix:///var/run/docker.sock"
      - "--providers.swarm.exposedByDefault=false"
      - "--providers.swarm.network=traefik_public"

      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22"

      # Let's Encrypt via Cloudflare DNS-01
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@scsi.digital}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.delaybeforecheck=10"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"

      # Certificado wildcard (emitido 1x, cobre todos os subdomínios)
      - "--entrypoints.websecure.http.tls.certresolver=letsencrypt"
      - "--entrypoints.websecure.http.tls.domains[0].main=scsi.digital"
      - "--entrypoints.websecure.http.tls.domains[0].sans=*.scsi.digital"

      # Logs
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--accesslog.format=json"
    environment:
      CLOUDFLARE_DNS_API_TOKEN: /run/secrets/cloudflare_api_token

    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    volumes:
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik_public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        # Dashboard
        - "traefik.enable=true"
        - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.scsi.digital`)"
        - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
        - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
        - "traefik.http.routers.traefik-dashboard.service=api@internal"
        # Basic Auth (hash bcrypt de htpasswd -nbB admin; '$' duplicados p/ o Swarm)
        # Usuario: admin | Senha: sCs!@Tr@$fiK110726
        - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth"
        - "traefik.http.middlewares.traefik-auth.basicauth.users=admin:$$2y$$05$$C7x/Q7A/97p2XcosPjO/deKhfyX3TmHqdibOFlEqpM1Z0Cntp.QcC"
        - "traefik.http.services.traefik-dashboard.loadbalancer.server.port=8080"
      resources:
        limits:
          cpus: "0.5"
          memory: 192M
        reservations:
          cpus: "0.15"
          memory: 64M

  migrate:
    image: ghcr.io/pycodebr/scsi_v1:latest
    # entrypoint.sh roda migrate (RUN_MIGRATIONS=1) + collectstatic e entao executa este command
    command: ["echo", ">>> migrate + collectstatic concluidos"]
    environment:
      RUN_MIGRATIONS: "1"
    env_file: .env
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    networks:
      - scsi_v1_internal
    deploy:
      replicas: 1
      restart_policy:
        condition: none

  app:
    image: ghcr.io/pycodebr/scsi_v1:latest
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120 --graceful-timeout 30
    env_file: .env
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    networks:
      - traefik_public
      - scsi_v1_internal
    deploy:
      replicas: 2
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.scsi.rule=Host(`${DOMAIN:-scsi.digital}`)"
        - "traefik.http.routers.scsi.entrypoints=websecure"
        - "traefik.http.routers.scsi.tls=true"
        - "traefik.http.routers.scsi.tls.certresolver=letsencrypt"
        - "traefik.http.services.scsi.loadbalancer.server.port=8000"
        - "traefik.http.middlewares.scsi-ratelimit.ratelimit.average=100"
        - "traefik.http.middlewares.scsi-ratelimit.ratelimit.burst=50"
        - "traefik.http.routers.scsi.middlewares=scsi-ratelimit"
      resources:
        limits:
          memory: 512M

  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - scsi_v1_internal

  rabbitmq:
    image: rabbitmq:3-management
    env_file: .env
    networks:
      - scsi_v1_internal

  redis:
    image: redis:7
    networks:
      - scsi_v1_internal

  celery_worker:
    image: ghcr.io/pycodebr/scsi_v1:latest
    command: celery -A core worker -l info
    env_file: .env
    volumes:
      - media_data:/app/media
    networks:
      - scsi_v1_internal
    deploy:
      replicas: 2

  celery_beat:
    image: ghcr.io/pycodebr/scsi_v1:latest
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    networks:
      - scsi_v1_internal

networks:
  traefik_public:
    external: true
  scsi_v1_internal:

volumes:
  pg_data:
  media_data:
  static_data:
  letsencrypt: