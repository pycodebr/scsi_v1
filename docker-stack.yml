version: "3.8"

services:
  traefik:
    image: traefik:v3.0
    command:
      - "--providers.docker=true"
      - "--providers.docker.swarmMode=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik_public"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@scsi.digital}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    volumes:
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik_public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  app:
    image: registry.example.com/scsi:latest
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120 --graceful-timeout 30
    environment:
      RUN_MIGRATIONS: "1"
    env_file: .env
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    networks:
      - traefik_public
      - internal
    deploy:
      replicas: 2
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.scsi.rule=Host(`${DOMAIN:-scsi.digital}`)"
        - "traefik.http.routers.scsi.entrypoints=websecure"
        - "traefik.http.routers.scsi.tls=true"
        - "traefik.http.routers.scsi.tls.certresolver=letsencrypt"
        - "traefik.http.services.scsi.loadbalancer.server.port=8000"
        - "traefik.http.middlewares.scsi-ratelimit.ratelimit.average=100"
        - "traefik.http.middlewares.scsi-ratelimit.ratelimit.burst=50"
        - "traefik.http.routers.scsi.middlewares=scsi-ratelimit"
      resources:
        limits:
          memory: 512M

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - internal

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    networks:
      - internal

  redis:
    image: redis:7
    networks:
      - internal

  celery_worker:
    image: registry.example.com/scsi:latest
    command: celery -A core worker -l info
    env_file: .env
    volumes:
      - media_data:/app/media
    networks:
      - internal
    deploy:
      replicas: 2

  celery_beat:
    image: registry.example.com/scsi:latest
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    networks:
      - internal

networks:
  traefik_public:
    external: true
  internal:

volumes:
  pg_data:
  media_data:
  static_data:
  letsencrypt: